</style><link rel="stylesheet" href="/theme.css"><header>STREET EMPIRE <small> / RP MANAGEMENT</small></header><main><nav id="nav"></nav><section id="view"></section></main><script>
const v=document.querySelector('#view'),nav=document.querySelector('#nav');let D,weekOffset=0; const dayMs=86400000; function bounds(offset=weekOffset){let now=new Date(), startDay=Number(D.settings.weekStart??1), local=new Date(now.getTime()+Number(D.settings.utcOffset??120)*60000);let [hh,mm]=(D.settings.weekTime??"18:00").split(":").map(Number);let midnight=Date.UTC(local.getUTCFullYear(),local.getUTCMonth(),local.getUTCDate());let start=midnight+ (hh*60+mm)*60000-((local.getUTCDay()-startDay+7)%7)*dayMs-Number(D.settings.utcOffset??120)*60000;if(start>now.getTime())start-=7*dayMs;start+=offset*7*dayMs;return [start,start+7*dayMs]} function weekly(){let [a,b]=bounds();return D.entries.filter(e=>+new Date(e.created)>=a&&+new Date(e.created)<b)} function weekLabel(){let [a,b]=bounds();return new Date(a+Number(D.settings.utcOffset??120)*60000).toISOString().slice(0,16).replace("T"," ")+" — "+new Date(b+Number(D.settings.utcOffset??120)*60000).toISOString().slice(0,16).replace("T"," ")}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,body){let r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('Request failed ('+r.status+')');return r.json()}function form(html,fn){v.innerHTML=html;v.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await fn(Object.fromEntries(new FormData(e.target)));}catch(e){alert(e.message)}}}function login(){document.body.classList.add('login');nav.innerHTML='';form('<article><h2>Organisation login</h2><form><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></article>',async x=>{await api('login',x);await load()})}async function load(page='Dashboard'){try{D=await api('data')}catch(e){login();return}document.body.classList.remove('login');document.querySelector('header').textContent=D.settings.name+' / RP MANAGEMENT';let pages=['Dashboard','Sales','Purchases','Inventory','Payroll','Reports',...(D.user.role==='boss'?['Staff','Finances','Settings']:[])];nav.innerHTML='';for(let p of pages){let b=document.createElement('button');b.dataset.page=p;b.textContent=({'Dashboard':'♛ The Throne','Sales':'↗ Sales','Purchases':'↙ Purchases','Inventory':'▣ The Stash','Staff':'♟ The Crew','Payroll':'$ Payday','Finances':'$ Dirty Money','Reports':'★ Street Rep','Settings':'⚙ The Setup'})[p];let labels={Dashboard:['♛','The Throne','Empire overview'],Sales:['↗','Sales','RP transactions'],Purchases:['↙','Purchases','RP acquisitions'],Inventory:['▣','The Stash','Inventory'],Staff:['♟','The Crew','Members & ranks'],Payroll:['$','Payday','Weekly salaries'],Finances:['$','Dirty Money','Game finances'],Reports:['★','Street Rep','Weekly reports'],Settings:['⚙','The Setup','Configuration']};let [ic,n,sub]=labels[p];b.innerHTML='<span class="navicon">'+ic+'</span><span>'+n+'<small>'+sub+'</small></span>';b.onclick=()=>{weekOffset=0;show(p)};nav.append(b)}let b=document.createElement('button');b.textContent='Logout';b.onclick=async()=>{await api('logout',{});login()};nav.append(b);show(page)}const money=x=>esc(D.settings.currency)+Number(x).toLocaleString(undefined,{maximumFractionDigits:2});const total=t=>weekly().filter(e=>e.type===t).reduce((a,e)=>a+e.quantity*Number(e.price),0);function table(rows){return '<article class="scroll"><table><tr><th>Date</th><th>Member</th><th>Type</th><th>Item</th><th>Qty</th><th>Total</th></tr>'+rows.map(e=>'<tr>'+[new Date(e.created).toLocaleString(),e.username,e.type,e.item,e.quantity].map(x=>'<td>'+esc(x)+'</td>').join('')+'<td>'+money(e.quantity*e.price)+'</td></tr>').join('')+'</table></article>'}function entry(type){return '<form><select name="item">'+D.settings.products.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><input name="quantity" type="number" min="1" placeholder="Quantity" required><input name="price" type="number" min="0" step="0.01" placeholder="Unit price (RP currency)" required><button>Record '+type+'</button></form>'}function show(p){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let sales=total('sale'),cost=total('purchase'),commission=weekly().filter(e=>e.type==='sale').reduce((a,e)=>a+e.quantity*e.price*e.commission/100,0);let cards=Object.entries({'Recorded sales':sales,'Recorded purchases':cost,'Net recorded cash flow':sales-cost-total('expense')-total('payroll'),'Recorded commission':commission}).map(([k,x])=>'<article class="metric"><span class="symbol">'+({'Recorded sales':'▤','Recorded purchases':'▣','Net recorded cash flow':'$','Recorded commission':'★'}[k])+'</span><div><small>'+k+'</small><h2>'+money(x)+'</h2></div></article>').join('');if(p==='Dashboard'||p==='Reports'){let rows=weekly(), [start,end]=bounds(), days=Array.from({length:7},(_,i)=>rows.filter(e=>e.type==='sale'&&+new Date(e.created)>=start+i*dayMs&&+new Date(e.created)<start+(i+1)*dayMs).reduce((a,e)=>a+e.quantity*Number(e.price),0)),max=Math.max(1,...days);let members=D.user.role==='boss'?D.members:[D.user];let title=p==='Dashboard'?'THE THRONE':'STREET REP';v.innerHTML='<div class="weekbar"><div><h2>'+title+'</h2><small>'+esc(D.user.username)+' • '+esc(D.user.role)+' • RP game economy</small></div><div><button id="prevweek">‹</button> <strong>'+weekLabel()+'</strong> <button id="nextweek" '+(weekOffset===0?'disabled':'')+'>›</button></div></div><div class="grid">'+cards+'</div><div class="dash"><article><h3>Weekly performance</h3><div class="chart">'+days.map(x=>'<div title="'+money(x)+'" style="height:'+Math.max(2,x/max*100)+'%"></div>').join('')+'</div><div class="days">'+days.map((x,i)=>'<span>'+new Date(start+i*dayMs+Number(D.settings.utcOffset??120)*60000).toLocaleDateString('en',{weekday:'short',timeZone:'UTC'})+'</span>').join('')+'</div></article><article><h3>Weekly overview</h3><div class="crewline">Recorded activity <strong>'+rows.length+'</strong></div><div class="crewline">Week <strong>'+weekLabel()+'</strong></div><div class="crewline">Registered crew <strong>'+members.length+'</strong></div></article><article><h3>The Crew</h3>'+members.slice(0,6).map(m=>'<div class="crewline"><strong><span class="avatar">'+esc(m.username.slice(0,1).toUpperCase())+'</span>'+esc(m.username)+'</strong><small>'+esc(m.role)+'</small></div>').join('')+'<p><small>'+members.length+' registered members</small></p></article><article class="wide"><h3>Recent RP activity</h3>'+(rows.length?table(rows.slice(0,5)):'<div class="empty">No activity recorded for this week.</div>')+'</article><article><h3>Next weekly reset</h3><h2>'+Math.max(0,Math.floor((bounds(0)[1]-Date.now())/dayMs))+' days '+Math.max(0,Math.floor((bounds(0)[1]-Date.now())/3600000)%24)+' hours</h2><small>Current cycle ends '+new Date(bounds(0)[1]+Number(D.settings.utcOffset??120)*60000).toISOString().slice(0,16).replace("T"," ")+'</small></article></div>';document.querySelector('#prevweek').onclick=()=>{weekOffset--;show(p)};document.querySelector('#nextweek').onclick=()=>{if(weekOffset<0)weekOffset++;show(p)};return}if(p==='Sales'||p==='Purchases'){let t=p==='Sales'?'sale':'purchase';form('<h2>'+p+'</h2><article>'+entry(t)+'</article>'+table(D.entries.filter(e=>e.type===t)),async x=>{await api('entry',{...x,type:t,quantity:+x.quantity,price:+x.price});await load(p)});return}if(p==='Inventory'){v.innerHTML='<h2>Recorded inventory movements</h2>'+D.settings.products.map(x=>'<article>'+esc(x)+' : '+D.entries.filter(e=>e.item===x).reduce((a,e)=>a+(e.type==='purchase'?e.quantity:e.type==='sale'?-e.quantity:0),0)+'</article>').join('');return}if(p==='Payroll'){v.innerHTML='<h2>Payroll overview</h2><article>Base salary: '+money(D.user.salary)+'<p>Recorded commissions: '+money(commission)+'</p></article>'+ (D.user.role==='boss'?D.members.map(m=>'<article>'+esc(m.username)+' — '+money(m.salary)+'</article>').join(''):'');return}if(p==='Staff'){form('<h2>THE CREW</h2><article><h3>Create member</h3><form><input name="username" placeholder="Username" required><input name="password" type="password" minlength="8" placeholder="Initial password" required><select name="role"><option>staff</option><option>boss</option></select><label>Weekly base salary</label><input name="salary" type="number" min="0" step="0.01" value="'+Number(D.settings.salary)+'" required><button>Create member</button></form></article><article class="scroll"><h3>Registered members</h3><table><tr><th>Member</th><th>Rank</th><th>Weekly salary</th><th>Action</th></tr>'+D.members.map(m=>'<tr><td>'+esc(m.username)+'</td><td>'+esc(m.role)+'</td><td>'+money(m.salary)+'</td><td><button type="button" data-edit="'+Number(m.id)+'">Edit member</button></td></tr>').join('')+'</table></article>',async x=>{await api('member',{...x,salary:+x.salary});await load(p)});v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editMember(Number(b.dataset.edit)));return}if(p==='Settings'){let s=D.settings;form('<h2>Settings</h2><article><form><label>Organisation name</label><input name="name" value="'+esc(s.name)+'"><label>Currency symbol</label><input name="currency" value="'+esc(s.currency)+'"><label>Weekly cycle starts on</label><select name="weekStart">'+["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].map((d,i)=>'<option value="'+i+'" '+(Number(s.weekStart??1)===i?"selected":"")+'>'+d+'</option>').join('')+'</select><label>Weekly reset time (24-hour)</label><input name="weekTime" type="time" value="'+esc(s.weekTime??"18:00")+'" required><label>Server UTC offset (minutes; South Africa = 120)</label><input name="utcOffset" type="number" min="-720" max="840" value="'+(s.utcOffset??120)+'" required><label>Default weekly salary</label><input name="salary" type="number" min="0" value="'+s.salary+'"><label>Sales commission %</label><input name="commission" type="number" min="0" max="100" value="'+s.commission+'"><label>Fictional RP items (one per line)</label><textarea name="products">'+esc(s.products.join('\n'))+'</textarea><button>Save settings</button></form></article>',async x=>{await api('settings',{...x,salary:+x.salary,commission:+x.commission,weekStart:+x.weekStart,utcOffset:+x.utcOffset,products:x.products.split('\n').map(x=>x.trim()).filter(Boolean)});await load(p)});return}if(p==='Finances'){form('<h2>Finances</h2><div class="grid">'+cards+'</div><article><form><select name="type"><option>expense</option><option>payroll</option></select><input name="item" placeholder="Description" required><input name="price" type="number" min="0" step="0.01" required><button>Record payment</button></form></article>'+table(D.entries),async x=>{await api('entry',{...x,quantity:1,price:+x.price});await load(p)})}}function editMember(id){const m=D.members.find(x=>Number(x.id)===id);if(!m)return;form('<h2>EDIT MEMBER</h2><article><form><label>Username</label><input name="username" maxlength="100" required value="'+esc(m.username)+'"><label>Rank</label><select name="role"><option value="staff" '+(m.role==='staff'?'selected':'')+'>Staff</option><option value="boss" '+(m.role==='boss'?'selected':'')+'>Boss</option></select><label>Weekly base salary (RP currency)</label><input name="salary" type="number" min="0" max="1000000000" step="0.01" required value="'+Number(m.salary)+'"><p>Changes update the current member profile. Recorded payments are not changed.</p><button>Save changes</button> <button type="button" id="cancelEdit">Cancel</button></form></article>',async x=>{await api('member/edit',{id,username:x.username,role:x.role,salary:Number(x.salary)});await load('Staff')});v.querySelector('#cancelEdit').onclick=()=>show('Staff')}load();</script></html>
