<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Street Empire RP</title><style> *{box-sizing:border-box}body{margin:0;background:#101116;color:#eee;font:15px system-ui}header{padding:22px;background:#191a21;border-bottom:2px solid #a83248;letter-spacing:3px}main{display:flex;min-height:85vh}nav{width:220px;background:#191a21;padding:16px}section{flex:1;padding:24px;min-width:0}button,input,select,textarea{font:inherit;padding:12px;border:1px solid #41414c;border-radius:7px;background:#22242d;color:white;margin:5px 0}button{cursor:pointer;background:#852b3d}nav button{display:block;width:100%;text-align:left;background:#272831}article{background:#1c1e26;padding:20px;border:1px solid #30313a;border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}h2{margin-top:0}small{color:#aaa}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #333}form{display:grid;max-width:550px;gap:8px}.scroll{overflow:auto}@media(max-width:700px){main{display:block}nav{width:100%;display:flex;overflow:auto;gap:6px}nav button{width:auto;white-space:nowrap}section{padding:12px}}
:root{--lime:#b9f522;--purple:#bd36f5}body{background:radial-gradient(ellipse at 85% 0,#351044 0,transparent 45%),#101014;color:#f4f4f4}header{min-height:140px;background:linear-gradient(90deg,#111 0%,transparent 55%,#111 100%),url('/banner.webp') center/cover;border-bottom:2px solid var(--purple);display:flex;align-items:end;font-size:20px;font-weight:900;font-style:italic;color:var(--lime);text-shadow:2px 2px #000}nav{background:linear-gradient(150deg,#25102e,#141418 55%);border-right:1px solid #663080}nav:before{content:'';display:block;height:130px;background:url('/logo.webp') center/contain no-repeat;margin-bottom:15px}nav button{background:transparent;border:0;border-bottom:1px solid #38313f;border-radius:0;font-weight:750;font-style:italic;padding:15px}nav button:hover,nav button.active{background:var(--lime);color:#111}section{padding:28px}h2{font-size:26px;font-weight:950;font-style:italic;text-transform:uppercase;letter-spacing:-.5px;color:var(--lime)}article{background:linear-gradient(135deg,#26202e,#15151b 70%);border:1px solid #71358d;border-radius:5px;box-shadow:inset 0 1px #ffffff12,0 4px 16px #0005} .grid article:nth-child(even){border-color:#819d28}.grid article h2{color:white;margin:12px 0 0}button{background:#a8e51b;color:#111;font-weight:800;border-color:#a8e51b}input,select,textarea{background:#15131b;border-color:#624275}th{color:var(--lime);text-transform:uppercase;font-size:12px}td{border-color:#39313f}small{color:#bdb4c6}body.login main{justify-content:center;align-items:center;min-height:75vh}body.login nav{display:none}body.login section{max-width:480px}body.login article{padding:35px} @media(max-width:700px){header{min-height:100px}nav:before{display:none}nav{border-right:0}section{padding:14px}h2{font-size:22px}}

/* Sidebar contrast correction */
nav button{color:#f5f3fa;background:transparent;font-size:16px;line-height:1.35;transition:background .15s,color .15s}
nav button:hover{background:#7022a0;color:#fff}
nav button.active,nav button.active:hover{background:var(--lime);color:#111}
nav button:last-child{color:#ff858d}
nav button:last-child:hover{background:#702b38;color:#fff}
nav button:focus-visible{outline:2px solid var(--lime);outline-offset:-2px}
</style><header>STREET EMPIRE <small> / RP MANAGEMENT</small></header><main><nav id="nav"></nav><section id="view"></section></main><script>
const v=document.querySelector('#view'),nav=document.querySelector('#nav');let D;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,body){let r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('Request failed ('+r.status+')');return r.json()}function form(html,fn){v.innerHTML=html;v.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await fn(Object.fromEntries(new FormData(e.target)));}catch(e){alert(e.message)}}}function login(){document.body.classList.add('login');nav.innerHTML='';form('<article><h2>Organisation login</h2><form><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></article>',async x=>{await api('login',x);await load()})}async function load(page='Dashboard'){try{D=await api('data')}catch(e){login();return}document.body.classList.remove('login');document.querySelector('header').textContent=D.settings.name+' / RP MANAGEMENT';let pages=['Dashboard','Sales','Purchases','Inventory','Payroll','Reports',...(D.user.role==='boss'?['Staff','Finances','Settings']:[])];nav.innerHTML='';for(let p of pages){let b=document.createElement('button');b.dataset.page=p;b.textContent=({'Dashboard':'♛ The Throne','Sales':'↗ Sales','Purchases':'↙ Purchases','Inventory':'▣ The Stash','Staff':'♟ The Crew','Payroll':'$ Payday','Finances':'$ Dirty Money','Reports':'★ Street Rep','Settings':'⚙ The Setup'})[p];b.onclick=()=>show(p);nav.append(b)}let b=document.createElement('button');b.textContent='Logout';b.onclick=async()=>{await api('logout',{});login()};nav.append(b);show(page)}const money=x=>esc(D.settings.currency)+Number(x).toLocaleString(undefined,{maximumFractionDigits:2});const total=t=>D.entries.filter(e=>e.type===t).reduce((a,e)=>a+e.quantity*Number(e.price),0);function table(rows){return '<article class="scroll"><table><tr><th>Date</th><th>Member</th><th>Type</th><th>Item</th><th>Qty</th><th>Total</th></tr>'+rows.map(e=>'<tr>'+[new Date(e.created).toLocaleString(),e.username,e.type,e.item,e.quantity].map(x=>'<td>'+esc(x)+'</td>').join('')+'<td>'+money(e.quantity*e.price)+'</td></tr>').join('')+'</table></article>'}function entry(type){return '<form><select name="item">'+D.settings.products.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><input name="quantity" type="number" min="1" placeholder="Quantity" required><input name="price" type="number" min="0" step="0.01" placeholder="Unit price (RP currency)" required><button>Record '+type+'</button></form>'}function show(p){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let sales=total('sale'),cost=total('purchase'),commission=D.entries.filter(e=>e.type==='sale').reduce((a,e)=>a+e.quantity*e.price*e.commission/100,0);let cards=Object.entries({'Recorded sales':sales,'Recorded purchases':cost,'Net recorded cash flow':sales-cost-total('expense')-total('payroll'),'Recorded commission':commission}).map(([k,x])=>'<article><small>'+k+'</small><h2>'+money(x)+'</h2></article>').join('');if(p==='Dashboard'||p==='Reports'){v.innerHTML='<h2>'+p+'</h2><small>'+esc(D.user.username)+' • '+esc(D.user.role)+' • fictional game economy</small><div class="grid">'+cards+'</div>'+table(D.entries);return}if(p==='Sales'||p==='Purchases'){let t=p==='Sales'?'sale':'purchase';form('<h2>'+p+'</h2><article>'+entry(t)+'</article>'+table(D.entries.filter(e=>e.type===t)),async x=>{await api('entry',{...x,type:t,quantity:+x.quantity,price:+x.price});await load(p)});return}if(p==='Inventory'){v.innerHTML='<h2>Recorded inventory movements</h2>'+D.settings.products.map(x=>'<article>'+esc(x)+' : '+D.entries.filter(e=>e.item===x).reduce((a,e)=>a+(e.type==='purchase'?e.quantity:e.type==='sale'?-e.quantity:0),0)+'</article>').join('');return}if(p==='Payroll'){v.innerHTML='<h2>Payroll overview</h2><article>Base salary: '+money(D.user.salary)+'<p>Recorded commissions: '+money(commission)+'</p></article>'+ (D.user.role==='boss'?D.members.map(m=>'<article>'+esc(m.username)+' — '+money(m.salary)+'</article>').join(''):'');return}if(p==='Staff'){form('<h2>Staff</h2><article><form><input name="username" placeholder="Username" required><input name="password" type="password" minlength="8" placeholder="Initial password" required><select name="role"><option>staff</option><option>boss</option></select><input name="salary" type="number" min="0" value="'+D.settings.salary+'" required><button>Create member</button></form></article>'+D.members.map(m=>'<article>'+esc(m.username)+' • '+esc(m.role)+' • '+money(m.salary)+'</article>').join(''),async x=>{await api('member',{...x,salary:+x.salary});await load(p)});return}if(p==='Settings'){let s=D.settings;form('<h2>Settings</h2><article><form><label>Organisation name</label><input name="name" value="'+esc(s.name)+'"><label>Currency symbol</label><input name="currency" value="'+esc(s.currency)+'"><label>Default salary</label><input name="salary" type="number" min="0" value="'+s.salary+'"><label>Sales commission %</label><input name="commission" type="number" min="0" max="100" value="'+s.commission+'"><label>Fictional RP items (one per line)</label><textarea name="products">'+esc(s.products.join('\n'))+'</textarea><button>Save settings</button></form></article>',async x=>{await api('settings',{...x,salary:+x.salary,commission:+x.commission,products:x.products.split('\n').map(x=>x.trim()).filter(Boolean)});await load(p)});return}if(p==='Finances'){form('<h2>Finances</h2><div class="grid">'+cards+'</div><article><form><select name="type"><option>expense</option><option>payroll</option></select><input name="item" placeholder="Description" required><input name="price" type="number" min="0" step="0.01" required><button>Record payment</button></form></article>'+table(D.entries),async x=>{await api('entry',{...x,quantity:1,price:+x.price});await load(p)})}}load();</script></html>
